<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    The Zenerate mark: a lotus in line art, five petals over a base line with
    three dots above, the way a lotus is inked rather than filled. Drawn by hand
    on a 100-unit grid; this file is the source.

    Each side petal's inner edge ends on its neighbour's outline, so no stroke
    crosses another and nothing has to be occluded. Two weights live here: the
    ink weight (stroke-width) for 32px and up, and the bold weight
    (data-bold-stroke-width) below that, where the base and the dots are left
    out and the petals alone carry the shape.

    scripts/icons/mark.ts reads the geometry below by id and renders every
    raster in public/ and src/app/favicon.ico from it, taking colours from
    DESIGN.md. src/components/brand-mark.tsx carries the same paths for inline
    use (a test keeps them in step). Edit here, then run
    `npx tsx scripts/build-icons.ts`.

    The colours here are Amethyst Glow and Rose Quartz, so the file previews
    as it ships on dark; they are not read by anything.
  -->
  <g id="petals" fill="none" stroke="#a995c9" stroke-width="5" data-bold-stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 74 C40 62 36 40 50 16 C64 40 60 62 50 74 Z"/>
    <path d="M50 74 C38 70 24 56 21 32"/>
    <path d="M21 32 C30 42 38 46 41 49.5"/>
    <path d="M50 74 C62 70 76 56 79 32"/>
    <path d="M79 32 C70 42 62 46 59 49.5"/>
    <path d="M50 74 C36 76 16 70 6 52"/>
    <path d="M6 52 C16 56 28 60 33.8 62.5"/>
    <path d="M50 74 C64 76 84 70 94 52"/>
    <path d="M94 52 C84 56 72 60 66.2 62.5"/>
  </g>
  <path id="base" fill="none" stroke="#a995c9" stroke-width="5" stroke-linecap="round" d="M12 80 C26 94 74 94 88 80"/>
  <g id="dots" fill="#f2b8c6">
    <circle cx="50" cy="6" r="3.2"/>
    <circle cx="23" cy="17" r="2.7"/>
    <circle cx="77" cy="17" r="2.7"/>
  </g>
</svg>
